<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Limbus Company 攻略投稿サイトのプロフィール設定ページです。">
  <title>プロフィール設定 | Limbus Company 攻略投稿サイト</title>
  <link rel="icon" href="logo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=1.0.65">
  <link rel="stylesheet" href="css/profile.css?v=1.0.65">
  <style>
    /* v1.0.65: mobile profile header matches the shared account subpage header. */
    @media(max-width:760px){
      .profile-header{height:auto!important;min-height:0!important;overflow:visible!important;align-items:center!important;flex-wrap:wrap!important;gap:8px 10px!important;padding:9px 12px!important}
      .profile-header .profile-brand{flex:1 1 100%!important;min-width:0!important}
      .profile-header .profile-header-actions{width:100%!important;display:flex!important;align-items:center!important;gap:6px!important;flex:0 0 100%!important}
      .profile-header .profile-theme-button{flex:0 0 auto!important;min-width:auto!important}
      .profile-header .profile-back-link{display:grid!important;flex:1 1 0!important;min-width:0!important;min-height:38px!important;padding:8px 7px!important;border-radius:8px!important;font-size:11px!important;line-height:1.25!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
      .profile-main{padding-top:34px!important}
    }
    @media(max-width:390px){.profile-header .profile-back-link{font-size:10px!important;padding-inline:5px!important}}
  </style>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/supabase-config.js?v=1.0.65"></script>
<script defer src="js/auth.js?v=1.0.65"></script>
<script defer src="js/community-data.js?v=1.0.65"></script>
<script defer src="js/profile.js?v=1.0.65"></script>
<script defer src="js/public-alpha.js?v=1.0.65"></script>
</head>
<body class="profile-page">
  <header class="profile-header">
    <a class="profile-brand" href="index.html" aria-label="トップページへ戻る">
      <span class="profile-brand-logo"><img class="logo-light" src="logo-mark.svg" alt="" width="48" height="48"><img class="logo-dark" src="logo-mark-dark.svg" alt="" width="48" height="48"></span>
      <span><strong>Limbus Company</strong><small>攻略投稿サイト　<span>非公式</span></small></span>
    </a>
    <div class="profile-header-actions">
      <button class="theme-toggle profile-theme-button" type="button" data-profile-theme aria-label="ダークモードに切り替える" aria-pressed="false"><span aria-hidden="true" class="theme-toggle-sun">☼</span><span aria-hidden="true" class="theme-toggle-track"><span class="theme-toggle-knob"></span></span><span aria-hidden="true" class="theme-toggle-moon">☾</span></button>
      <a class="profile-back-link" href="index.html">⌂ トップへ戻る</a>
      <a class="profile-back-link" href="account.html">← アカウントへ戻る</a>
    </div>
  </header>

  <main class="profile-main">
    <section class="profile-heading">
      <p class="profile-kicker">ACCOUNT PROFILE</p>
      <h1>プロフィール</h1>
      <p>投稿者として表示される名前・アイコン・自己紹介を設定します。</p>
    </section>

    <div class="profile-notice" data-profile-notice hidden></div>

    <section class="profile-login-required" data-profile-login-required hidden>
      <h2>ログインが必要です</h2>
      <p>プロフィールを確認・編集するには、トップページからログインしてください。</p>
      <a href="index.html" class="profile-primary-link">トップページへ戻る</a>
    </section>

    <section class="profile-card" data-profile-content hidden>
      <div class="profile-preview-column">
        <div class="profile-avatar-frame">
          <img data-profile-avatar-preview src="logo-mark.svg" alt="プロフィール画像">
        </div>
        <p class="profile-preview-name" data-profile-name-preview>ユーザー</p>
        <div class="profile-public-badges"><span class="account-admin-badge" data-profile-admin hidden>🛡️ 管理者</span></div>
        <p class="profile-preview-email" data-profile-email></p>
        <dl class="profile-stats">
          <div><dt>登録日</dt><dd data-profile-created>―</dd></div>
          <div><dt>投稿数</dt><dd data-profile-post-count>0</dd></div>
          <div data-own-profile-stat><dt>ブックマーク</dt><dd data-profile-bookmark-count>0</dd></div><div><dt>フォロー</dt><dd data-profile-following-count>0</dd></div><div><dt>フォロワー</dt><dd data-profile-follower-count>0</dd></div>
        </dl>
      </div>

      <div class="profile-follow-panel" data-profile-follow-panel hidden><button type="button" class="profile-save-button" data-profile-follow>フォローする</button><p>フォロワー一覧は公開されません。</p></div>
      <form class="profile-form" data-profile-form>
        <label>
          <span>表示名 <b>必須</b></span>
          <input name="display_name" maxlength="30" autocomplete="nickname" required placeholder="サイト上で表示する名前">
          <small><span data-profile-name-count>0</span> / 30文字</small>
        </label>

        <label class="profile-avatar-upload">
          <span>アイコン画像ファイル</span>
          <input name="avatar_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          <small>JPG・PNG・WebP・GIF、5MBまで。選択した画像は保存時にアップロードされます。</small>
        </label>

        <label>
          <span>アイコン画像URL <em>任意</em></span>
          <input name="avatar_url" type="url" inputmode="url" placeholder="https://.../image.png">
          <small>画像ファイルを選ばない場合のみ使用します。blob:で始まる一時URLは保存できません。</small>
        </label>

        <label>
          <span>自己紹介</span>
          <textarea name="bio" maxlength="200" rows="6" placeholder="得意な編成や、よく使うキーワードなどを書けます。"></textarea>
          <small><span data-profile-bio-count>0</span> / 200文字</small>
        </label>

        <div class="profile-form-actions">
          <button class="profile-save-button" type="submit" data-profile-save>変更を保存</button>
          <button class="profile-reset-button" type="button" data-profile-reset>入力を元に戻す</button>
        </div>
      </form>
    </section>
  </main>

  
  
  
  
</body>
</html>
