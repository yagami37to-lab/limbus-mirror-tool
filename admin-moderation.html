</head><body class="account-page moderation-page" data-account-page="moderation"><header class="account-shell-header"><a class="account-brand" href="index.html"><span class="account-brand-logo"><img class="logo-light" src="logo-mark.svg" alt=""><img class="logo-dark" src="logo-mark-dark.svg" alt=""></span><span><strong>Limbus Company</strong><small>攻略投稿サイト　<span>非公式</span></small></span></a><div class="account-header-actions"><button aria-label="ダークモードに切り替える" aria-pressed="false" class="theme-toggle account-theme-toggle" data-account-theme-toggle type="button"><span aria-hidden="true" class="theme-toggle-sun">☼</span><span aria-hidden="true" class="theme-toggle-track"><span class="theme-toggle-knob"></span></span><span aria-hidden="true" class="theme-toggle-moon">☾</span></button><a class="account-back-link" href="account.html">← アカウントへ戻る</a></div></header><main class="account-main"><section class="account-hero"><p class="account-kicker">MODERATION</p><h1>通報管理</h1><p>通報された攻略を確認し、非表示・削除・投稿者のBAN対応を行います。</p></section><div class="account-notice" data-moderation-notice hidden></div><section class="account-login-required" data-moderation-denied hidden><h2>管理者権限が必要です</h2><p>この画面は管理者アカウントのみ利用できます。</p><a class="account-primary" href="account.html">アカウントへ戻る</a></section><section data-moderation-content hidden><div class="moderation-toolbar account-card"><div><strong>通報一覧</strong><small>未対応の通報を優先して表示します。</small></div><label>状態<select data-report-filter><option value="all">すべて</option><option value="pending">未対応</option><option value="reviewing">確認中</option><option value="dismissed">却下</option><option value="actioned">対応済み</option></select></label><button class="account-secondary" type="button" data-refresh-reports>再読み込み</button></div><div class="moderation-summary"><span>未対応 <b data-pending-count>0</b>件</span><span>全通報 <b data-report-count>0</b>件</span></div><div class="moderation-list" data-report-list></div><div class="account-empty" data-report-empty hidden><h2>該当する通報はありません</h2><p>新しい通報が届くとここに表示されます。</p></div></section></main></body></html>
